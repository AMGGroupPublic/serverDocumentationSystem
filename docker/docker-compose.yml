services:
  serverdocs:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: serverdocs:dev
    container_name: serverdocs
    restart: "no"
    volumes:
      - ../config:/config:ro
      - ../keys:/keys:ro
      - ../data:/data
    command: ["run", "--config", "/config/servers.yaml"]

  serverdocs-scheduler:
    # Long-running companion: scans on startup then every SCAN_INTERVAL seconds.
    # Uses the same image as the one-shot `serverdocs` service so a single
    # `docker compose build` covers both.
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: serverdocs:dev
    container_name: serverdocs-scheduler
    restart: unless-stopped
    environment:
      # Default: every hour. Override per-deployment.
      SCAN_INTERVAL: "3600"
      # On a failed scan, back off this many seconds before retrying instead
      # of waiting a full SCAN_INTERVAL.
      FAILURE_BACKOFF: "60"
    volumes:
      - ../config:/config:ro
      - ../keys:/keys:ro
      - ../data:/data
    entrypoint: ["/usr/local/bin/scheduler.sh"]
    command: []

  serverdocs-sb:
    image: ghcr.io/silverbulletmd/silverbullet:latest
    container_name: serverdocs-sb
    restart: unless-stopped
    #ports:
    #  - "3005:3000"
    volumes:
      # SilverBullet serves the discovered markdown tree as its "space".
      - ../data/output:/space
    environment:
      - SB_USER=admin:changeme
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
