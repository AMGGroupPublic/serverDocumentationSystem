services:
  serverdocs:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: serverdocs:dev
    container_name: serverdocs
    restart: "no"
    volumes:
      - ../config:/config:ro
      - ../keys:/keys:ro
      - ../data:/data
    command: ["run", "--config", "/config/servers.yaml"]

  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:latest
    container_name: serverdocs-sb
    restart: unless-stopped
    ports:
      - "3005:3000"
    volumes:
      # SilverBullet serves the discovered markdown tree as its "space".
      - ../data/output:/space
    environment:
      - SB_USER=admin:changeme
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
