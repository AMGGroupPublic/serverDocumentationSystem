services:
  serverdocs:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: serverdocs:dev
    container_name: serverdocs
    restart: "no"
    # Run as the host user so files written into /data land with host
    # ownership; otherwise the host user can't `git push` from data/output
    # without sudo. UID/GID come from docker/.env (see .env.example).
    user: "${SERVERDOCS_UID:-1000}:${SERVERDOCS_GID:-1000}"
    environment:
      HOME: /data
      USER: serverdocs
      LOGNAME: serverdocs
      # Point ssh/asyncssh at the host agent socket bind-mounted below. The
      # host shell running `docker compose` must have an unlocked agent
      # (`ssh-add -l`); leave SSH_AUTH_SOCK unset on the host to fall back to
      # keyfile-only auth. See docker/.env.example.
      SSH_AUTH_SOCK: ${SSH_AUTH_SOCK:+/ssh-agent}
    volumes:
      - ../config:/config:ro
      - ../keys:/keys:ro
      - ../data:/data
      # Host ssh-agent socket (no-op when SSH_AUTH_SOCK is unset on the host).
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    command: ["run", "--config", "/config/servers.yaml"]

  serverdocs-scheduler:
    # Long-running companion: scans on startup then every SCAN_INTERVAL seconds.
    # Uses the same image as the one-shot `serverdocs` service so a single
    # `docker compose build` covers both.
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: serverdocs:dev
    container_name: serverdocs-scheduler
    restart: unless-stopped
    user: "${SERVERDOCS_UID:-1000}:${SERVERDOCS_GID:-1000}"
    environment:
      # Default: every hour. Override per-deployment.
      SCAN_INTERVAL: "3600"
      # On a failed scan, back off this many seconds before retrying instead
      # of waiting a full SCAN_INTERVAL.
      FAILURE_BACKOFF: "60"
      # HOME defaults to / when running as a non-root UID without a passwd
      # entry; some tools (incl. ssh) look for ~/.ssh there. Point it at the
      # mounted data dir so ssh/git stay well-behaved.
      HOME: /data
      # asyncssh and other libs read USER/LOGNAME; there's no passwd entry
      # for the host UID inside the image, so set it explicitly.
      USER: serverdocs
      LOGNAME: serverdocs
      # See the serverdocs service above. NOTE: this is a long-running daemon;
      # a host logout/reboot or agent restart leaves the socket mount stale
      # until the container is recreated. Prefer keyfile auth here, or accept
      # the fragility. Empty when SSH_AUTH_SOCK is unset on the host.
      SSH_AUTH_SOCK: ${SSH_AUTH_SOCK:+/ssh-agent}
    volumes:
      - ../config:/config:ro
      - ../keys:/keys:ro
      - ../data:/data
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    entrypoint: ["/usr/local/bin/scheduler.sh"]
    command: []

  serverdocs-sb:
    image: ghcr.io/silverbulletmd/silverbullet:latest
    container_name: serverdocs-sb
    restart: unless-stopped
    user: "${SERVERDOCS_UID:-1000}:${SERVERDOCS_GID:-1000}"
    #ports:
    #  - "3005:3000"
    volumes:
      # SilverBullet serves the discovered markdown tree as its "space".
      - ../data/output:/space
    environment:
      - SB_USER=admin:changeme
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
