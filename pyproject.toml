[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "serverdocs"
version = "0.2.15"
description = "Discover VMs/containers across servers and maintain a markdown wiki tree"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Matt Lowe", email = "matt.lowe@amg-group.co.uk" },
]
keywords = ["ssh", "lxd", "docker", "wiki", "documentation", "discovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "asyncssh>=2.14",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.0",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]

[project.scripts]
serverdocs = "serverdocs.__main__:cli"

[project.urls]
Homepage = "https://github.com/marlscot/serverdocs"

[tool.hatch.build.targets.wheel]
packages = ["src/serverdocs"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=serverdocs --cov-report=term-missing --cov-fail-under=80"
